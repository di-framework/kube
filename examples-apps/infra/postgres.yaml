apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: examples-postgres
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: examples-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: examples-postgres
  template:
    metadata:
      labels:
        app: examples-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17.6-alpine
          env:
            - name: POSTGRES_DB
              value: examples
            - name: POSTGRES_USER
              value: examples
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: examples-postgres-binding
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, examples, -d, examples]
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: examples-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: examples-postgres
spec:
  selector:
    app: examples-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
