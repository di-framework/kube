apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actor-counter-storage
  namespace: wasmcloud
  labels:
    app.kubernetes.io/managed-by: di-framework
    app.kubernetes.io/name: actor-counter
    di-framework.dev/application: "actor-counter"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: actor-counter
  namespace: wasmcloud
  labels:
    app.kubernetes.io/managed-by: di-framework
    app.kubernetes.io/name: actor-counter
    di-framework.dev/application: "actor-counter"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: actor-counter
  namespace: wasmcloud
  labels:
    app.kubernetes.io/managed-by: di-framework
    app.kubernetes.io/name: actor-counter
    di-framework.dev/application: "actor-counter"
spec:
  replicas: 1
  template:
    spec:
      strategy:
        type: Recreate
      hostSelector:
        hostgroup: default
      kubernetes:
        service:
          name: actor-counter
        volumeMounts:
          - name: actor-storage
            mountPath: /data/actors
        volumes:
          - name: actor-storage
            persistentVolumeClaim:
              claimName: actor-counter-storage
      components:
        - name: actor-counter
          image: "registry.invalid/verification:probe"
          env:
            - name: ACTOR_STORAGE_DIR
              value: "/data/actors"
      hostInterfaces:
        - namespace: wasi
          package: http
          version: "0.3.0"
          interfaces:
            - handler
          config:
            "host": "actor-counter"
