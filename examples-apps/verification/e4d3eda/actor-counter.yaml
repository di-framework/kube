apiVersion: v1
kind: Service
metadata:
  name: actor-counter
  namespace: wasmcloud
  labels:
    app.kubernetes.io/managed-by: di-framework
    app.kubernetes.io/name: actor-counter
    di-framework.dev/application: "actor-counter"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: actor-counter
  namespace: wasmcloud
  labels:
    app.kubernetes.io/managed-by: di-framework
    app.kubernetes.io/name: actor-counter
    di-framework.dev/application: "actor-counter"
spec:
  replicas: 1
  deployPolicy: Recreate
  template:
    spec:
      hostSelector:
        hostgroup: storage
      volumes:
        - name: app-storage
          hostPath:
            path: "/var/lib/di-framework/storage/actor-counter"
      kubernetes:
        service:
          name: actor-counter
      components:
        - name: actor-counter
          image: "registry.invalid/verification:probe"
          localResources:
            environment:
              config:
                ACTOR_STORAGE_DIR: "/data/actors"
                DI_SQLITE_BACKEND: "wasm"
                DI_STORAGE_DIR: "/data/actors"
            volumeMounts:
              - name: app-storage
                mountPath: /data/actors
      hostInterfaces:
        - namespace: wasi
          package: http
          version: "0.3.0"
          interfaces:
            - handler
          config:
            "host": "actor-counter"
