apiVersion: v1
kind: Service
metadata:
  name: scheduled-maintenance
  namespace: wasmcloud
  labels:
    app.kubernetes.io/managed-by: di-framework
    app.kubernetes.io/name: scheduled-maintenance
    di-framework.dev/application: "scheduled-maintenance"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: scheduled-maintenance
  namespace: wasmcloud
  labels:
    app.kubernetes.io/managed-by: di-framework
    app.kubernetes.io/name: scheduled-maintenance
    di-framework.dev/application: "scheduled-maintenance"
spec:
  replicas: 1
  template:
    spec:
      hostSelector:
        hostgroup: default
      kubernetes:
        service:
          name: scheduled-maintenance
      components:
        - name: scheduled-maintenance
          image: "registry.invalid/verification:probe"
          localResources:
            environment:
              config:
                DI_CRON_MODE: "external"
      hostInterfaces:
        - namespace: wasi
          package: http
          version: "0.3.0"
          interfaces:
            - handler
          config:
            "host": "scheduled-maintenance"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scheduled-maintenance-verify-maintenance
  namespace: wasmcloud
  labels:
    app.kubernetes.io/managed-by: di-framework
    app.kubernetes.io/name: scheduled-maintenance
    di-framework.dev/application: "scheduled-maintenance"
    di-framework.dev/cron-job: "verify-maintenance"
spec:
  schedule: "0 0 1 1 *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 90
      template:
        metadata:
          labels:
            app.kubernetes.io/managed-by: di-framework
            app.kubernetes.io/name: scheduled-maintenance
            di-framework.dev/application: "scheduled-maintenance"
            di-framework.dev/cron-job: "verify-maintenance"
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cron-invoker
              image: "curlimages/curl:8.11.1"
              env:
                - name: DI_CRON_INVOKE_URL
                  value: "http://scheduled-maintenance.wasmcloud.svc.cluster.local/_di/cron/verify-maintenance/invoke"
                - name: DI_CRON_INVOKE_JOB
                  value: "verify-maintenance"
                - name: DI_CONTROL_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: scheduled-maintenance-control
                      key: token
                      optional: true
              command:
                - /bin/sh
                - -ec
                - |
                  set -eu
                  auth_header=""
                  if [ -n "${DI_CONTROL_TOKEN:-}" ]; then
                    auth_header="Authorization: Bearer ${DI_CONTROL_TOKEN}"
                  fi
                  response="$(curl -sS -f -X POST \
                    -H "Host: scheduled-maintenance" \
                    -H "content-type: application/json" \
                    ${auth_header:+-H "$auth_header"} \
                    --max-time 5 \
                    -d '{}' \
                    "$DI_CRON_INVOKE_URL")"
                  echo "$response"
                  echo "$response" | grep -q '"completed":true\|\"ok\":true'
