apiVersion: v1
kind: Service
metadata:
  name: schema-migrations
  namespace: wasmcloud
  labels:
    app.kubernetes.io/managed-by: di-framework
    app.kubernetes.io/name: schema-migrations
    di-framework.dev/application: "schema-migrations"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: schema-migrations
  namespace: wasmcloud
  labels:
    app.kubernetes.io/managed-by: di-framework
    app.kubernetes.io/name: schema-migrations
    di-framework.dev/application: "schema-migrations"
spec:
  replicas: 1
  deployPolicy: Recreate
  template:
    spec:
      hostSelector:
        hostgroup: storage
      volumes:
        - name: app-storage
          hostPath:
            path: "/var/lib/di-framework/storage/schema-migrations"
      kubernetes:
        service:
          name: schema-migrations
      components:
        - name: schema-migrations
          image: "registry.invalid/verification:probe"
          localResources:
            environment:
              config:
                DI_SQLITE_BACKEND: "wasm"
                DI_STORAGE_DIR: "/data"
                MIGRATION_DB_PATH: "/data/migrations.db"
                QUEUE_DB_PATH: "/data/queue.db"
            volumeMounts:
              - name: app-storage
                mountPath: /data
      hostInterfaces:
        - namespace: wasi
          package: http
          version: "0.3.0"
          interfaces:
            - handler
          config:
            "host": "schema-migrations"
